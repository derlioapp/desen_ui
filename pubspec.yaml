name: desen_ui
description: >-
  Web-grade UI components for Flutter, built on the widgets layer only.
  No Material or Cupertino dependency.
version: 0.1.0-alpha.1
repository: https://github.com/derlioapp/desen_ui
issue_tracker: https://github.com/derlioapp/desen_ui/issues
topics:
  - ui
  - design-system
  - widgets
  - accessibility
  - components

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Comes with flutter_test, which pins its version.
  leak_tracker_flutter_testing: any

flutter:
