name: desen_ui
description: >-
  Web-grade UI components for Flutter, built on the widgets layer only.
  No Material or Cupertino dependency.
version: 0.1.0-alpha.2
repository: https://github.com/derlioapp/desen_ui
documentation: https://derlioapp.github.io/desen_ui/
issue_tracker: https://github.com/derlioapp/desen_ui/issues
topics:
  - ui
  - design-system
  - widgets
  - accessibility
  - components

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Comes with flutter_test, which pins its version.
  leak_tracker_flutter_testing: any

flutter:
  # Desen's typefaces, under the SIL Open Font License 1.1
  # (fonts/OFL-*.txt). DsTypography looks them up in this package.
  fonts:
    - family: SchibstedGrotesk
      fonts:
        - asset: fonts/SchibstedGrotesk-Regular.ttf
          weight: 400
        - asset: fonts/SchibstedGrotesk-Medium.ttf
          weight: 500
        - asset: fonts/SchibstedGrotesk-SemiBold.ttf
          weight: 600
        - asset: fonts/SchibstedGrotesk-Bold.ttf
          weight: 700
    - family: GeistMono
      fonts:
        - asset: fonts/GeistMono-Regular.ttf
          weight: 400
        - asset: fonts/GeistMono-Medium.ttf
          weight: 500
        - asset: fonts/GeistMono-SemiBold.ttf
          weight: 600
