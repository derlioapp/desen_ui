# Builds the docs site (example/) for the web and publishes it to GitHub
# Pages: https://derlioapp.github.io/desen_ui/
name: Docs site

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a newer push replaces a queued one but never
# cancels a deployment already running.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/configure-pages@v6
      # The site lives under /desen_ui/. No service worker: a cached copy
      # would keep showing an old site after a deployment.
      - run: flutter build web --release --base-href /desen_ui/ --pwa-strategy=none
        working-directory: example
      - uses: actions/upload-pages-artifact@v5
        with:
          path: example/build/web

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
