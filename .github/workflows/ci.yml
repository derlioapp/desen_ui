# Checks every push and pull request against the pinned Flutter stable.
#
# Goldens are not checked here: they are generated and compared on the
# maintainer's Mac before every commit (another macOS version rasterizes
# text differently, so a CI runner would only report noise). On Linux the
# golden comparator skips them; behavior tests run in full.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: no job writes to the repository.
permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.6
  # The lowest Flutter the package supports: keep in step with
  # `environment: flutter:` in pubspec.yaml.
  MIN_FLUTTER_VERSION: 3.47.0

jobs:
  checks:
    name: Analyze, format, snippets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter pub get
        working-directory: example
      # Covers lib/, test/, tool/ and example/ (one analysis root).
      - run: flutter analyze
      - run: dart format --output=none --set-exit-if-changed lib test example/lib example/test
      - name: Code snippets match the example pages
        run: python3 tool/gen_snippets.py --check
      - name: Icon files match tool/icons
        run: python3 tool/gen_icons.py --check
      # Fails after a Flutter upgrade that changes the semantics API, so
      # the screen reader gaps it may close get a look.
      - name: Flutter semantics API as recorded
        run: python3 tool/flutter_gaps.py --check
      - name: Publish dry run
        run: dart pub publish --dry-run

  test:
    name: Tests (behavior)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter test --exclude-tags golden

  min-sdk:
    name: Minimum supported Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.MIN_FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib test
      - run: flutter test --exclude-tags golden

  example:
    name: Example tests and web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build web --release

  beta:
    name: Flutter beta (early warning)
    runs-on: ubuntu-latest
    # The next stable may break us; this says so early without blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: beta
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib test
      - run: flutter test --exclude-tags golden
