name: desen_ui_fonts
description: >-
  The typefaces of Desen UI: Schibsted Grotesk (text and numbers) and
  Geist Mono (code). Optional; add it for Desen's default look.
version: 0.1.0-dev.1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: SchibstedGrotesk
      fonts:
        - asset: fonts/SchibstedGrotesk-Regular.ttf
          weight: 400
        - asset: fonts/SchibstedGrotesk-Medium.ttf
          weight: 500
        - asset: fonts/SchibstedGrotesk-SemiBold.ttf
          weight: 600
        - asset: fonts/SchibstedGrotesk-Bold.ttf
          weight: 700
        - asset: fonts/SchibstedGrotesk-ExtraBold.ttf
          weight: 800
    - family: GeistMono
      fonts:
        - asset: fonts/GeistMono-Regular.ttf
          weight: 400
        - asset: fonts/GeistMono-Medium.ttf
          weight: 500
        - asset: fonts/GeistMono-SemiBold.ttf
          weight: 600
